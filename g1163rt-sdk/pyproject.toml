[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1163rt-sdk"
version = "0.1.0"
description = "Python SDK for G1163RT Continuous Automated Red Teaming (CART) CI/CD integrations."
readme = "README.md"
authors = [
    { name = "G1163RT Security Team", email = "ops@g1163rt.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "responses>=0.18.0",
]
